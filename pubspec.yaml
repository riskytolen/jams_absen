name: jams_absen
description: "JamsAbsen - Smart Attendance System"
publish_to: 'none'
version: 1.9.0+10

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  google_fonts: ^6.2.1
  supabase_flutter: ^2.12.4
  mobile_scanner: ^7.2.0
  geolocator: ^14.0.2
  audioplayers: ^6.6.0
  device_info_plus: ^12.4.0
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  camera: ^0.11.1
  google_mlkit_face_detection: ^0.12.0
  flutter_inappwebview: ^6.1.5
  dotted_border: ^3.1.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  package_info_plus: ^9.0.1
  dio: ^5.9.2
  path_provider: ^2.1.5


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0A1628"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/logo.png

